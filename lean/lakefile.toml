name = "NilpotentTridiagonal"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["NilpotentTridiagonal"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
# the Mathlib copyright-header convention does not apply to this project
weak.linter.style.header = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0"

[[lean_lib]]
name = "NilpotentTridiagonal"
